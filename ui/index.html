<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cue — Capital Overview</title>
    <meta
      name="description"
      content="Agent pipeline spend, stage throughput, and run transcripts."
    />
    <script>
      // Runs before first paint so a dark preference never flashes light.
      // Mirrors resolveTheme() in ~/lib/theme.
      (() => {
        try {
          var t = localStorage.getItem("cue-theme") || "system";
          var d =
            t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
