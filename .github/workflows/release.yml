name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bash scripts/build-binaries.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cue-*
            dist/checksums.txt
          generate_release_notes: true
