name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Bun 1.4.0 (the Rust rewrite, 2026-08-20) cannot listen() on the
          # windows runners: every loopback bind fails with EADDRINUSE errno 0
          # regardless of hostname or port. Pin the last pre-rewrite version
          # there until upstream fixes it; ubuntu keeps tracking latest.
          bun-version: ${{ matrix.os == 'windows-latest' && '1.3.14' || 'latest' }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bun run typecheck && bun run lint && bun run format:check
        working-directory: ui
